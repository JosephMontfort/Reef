name: Android CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: ./gradlew clean assembleRelease --stacktrace --console=plain

      - name: Get next version number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh release list --limit 1000 | wc -l)
          NEXT=$((COUNT + 1))
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          APK=$(find Reef/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK" "Reef-v${{ steps.version.outputs.version }}.apk"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Reef v${{ steps.version.outputs.version }}" \
            --notes "Automated release build"

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            "Reef-v${{ steps.version.outputs.version }}.apk" \
            --clobber
